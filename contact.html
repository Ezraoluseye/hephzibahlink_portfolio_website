<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - HephzibahLink</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav class="navbar">
      <h1>HephzibahLink</h1>
      <div>
        <a href="index.html">Home</a>
        <a href="index.html#projects">Projects</a>
        <a href="index.html#coursework">Coursework</a>
        <a href="contact.html">Contact</a>
      </div>
    </nav>
  </header>

  <section class="card contact">
    <h2>Contact Me</h2>
    <p>Please complete the form below to send a message.</p>

    <form id="contactForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your full name" />

      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter your email address" />

      <label for="message">Message</label>
      <textarea id="message" rows="5" placeholder="Write your message here"></textarea>

      <button type="submit">Send Message</button>
      <p id="formMessage"></p>
    </form>
  </section>

  <footer>
    <p>&copy; 2026 HephzibahLink | Portfolio Website</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
